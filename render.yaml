# Render Blueprint Specification (Infrastructure as Code)
# https://render.com/docs/blueprint-spec
services:
  # ====================================================================
  # Cách 1 (Khuyên dùng): Deploy Toàn bộ ứng dụng (Angular + Spring Boot + H2)
  # chạy trong 1 Web Service Docker duy nhất (Tối ưu 100% Free Tier của Render)
  # ====================================================================
  - type: web
    name: analyze-project
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    envVars:
      - key: PORT
        value: 10000
      - key: SPRING_PROFILES_ACTIVE
        value: prod
    healthCheckPath: /api/numbers

  # ====================================================================
  # Cách 2 (Tùy chọn): Nếu bạn muốn tách riêng Backend và Frontend
  # (Bỏ comment nếu muốn sử dụng cách này)
