# Render Blueprint Specification (Infrastructure as Code)
# https://render.com/docs/blueprint-spec
services:
  # ====================================================================
  # Web Service: Unified Docker (Angular Frontend + Spring Boot Backend)
  # ====================================================================
  - type: web
    name: analyze-project
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    envVars:
      - key: PORT
        value: 10000
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: analyze_project_db
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        value: analyze_project_db_user
      - key: SPRING_DATASOURCE_PASSWORD
        value: 6Tm0D7ChuHV0LImJZXFZ8BYTdGJXEzgN
      - key: DB_PASSWORD
        value: 6Tm0D7ChuHV0LImJZXFZ8BYTdGJXEzgN
    healthCheckPath: /api/numbers

databases:
  # ====================================================================
  # PostgreSQL Database: Render Managed PostgreSQL Database
  # ====================================================================
  - name: analyze_project_db
    databaseName: analyze_project_db
    user: analyze_project_db_user
    plan: free
    region: singapore
