# Render Blueprint Specification (Infrastructure as Code)
# https://render.com/docs/blueprint-spec
services:
  # ====================================================================
  # Web Service: Unified Docker (Angular Frontend + Spring Boot Backend)
  # ====================================================================
  - type: web
    name: analyze-project
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    envVars:
      - key: PORT
        value: 10000
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: analyze-postgres
          property: connectionString
    healthCheckPath: /api/numbers

databases:
  # ====================================================================
  # PostgreSQL Database: Render Managed PostgreSQL Database
  # ====================================================================
  - name: analyze-postgres
    databaseName: lotterydb
    user: postgres
    plan: free
    region: singapore
