# Server port (Tự động nhận diện cổng từ biến môi trường PORT của Render)
server.port=${PORT:8080}
spring.jackson.deserialization.accept-float-as-int=false

# Cấu hình PostgreSQL Database tự động từ RENDER
# Render cung cấp thông tin kết nối qua:
# 1. Biến môi trường hệ thống: DATABASE_URL (postgres://user:password@host:port/dbname)
# 2. Hoặc các thông số riêng rẽ: PGHOST, PGPORT, PGDATABASE, PGUSER, PGPASSWORD (hoặc DB_HOST,...)
# 3. Hoặc SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD
spring.datasource.url=${SPRING_DATASOURCE_URL:${JDBC_DATABASE_URL:jdbc:postgresql://${PGHOST:${DB_HOST:localhost}}:${PGPORT:${DB_PORT:5432}}/${PGDATABASE:${DB_NAME:lotterydb}}}}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${PGUSER:${DB_USERNAME:${DB_USER:postgres}}}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${PGPASSWORD:${DB_PASSWORD:postgres}}}

# Tối ưu Connection Pool HikariCP cho Render (tránh vượt giới hạn connection trên Render Free/Starter)
spring.datasource.hikari.maximum-pool-size=${DB_MAX_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:2}
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000

# JPA / Hibernate cho PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# =========================================================================================
# Cấu hình Flyway Migration & Baseline
# =========================================================================================
# Bật Flyway Migration
spring.flyway.enabled=true
# Tự động baseline khi database đã có dữ liệu trước đó (tránh lỗi trên database đang chạy)
spring.flyway.baseline-on-migrate=true
# Đặt baseline-version = 0 để Flyway hỗ trợ quản lý từ script V1
spring.flyway.baseline-version=0
spring.flyway.baseline-description=Initial database baseline
# Thư mục chứa các script Flyway migration
spring.flyway.locations=classpath:db/migration
# Vô hiệu hóa clean database để đảm bảo an toàn dữ liệu
spring.flyway.clean-disabled=true

# Experimental public stock feed: no permanent storage until data rights are confirmed.
stocks.source.enabled=${STOCKS_SOURCE_ENABLED:true}
stocks.source.price-scale=${STOCKS_SOURCE_PRICE_SCALE:1000}
stocks.source.price-basis=${STOCKS_SOURCE_PRICE_BASIS:UNKNOWN}
stocks.source.verified=${STOCKS_SOURCE_VERIFIED:false}
stocks.ml.buy-threshold=${STOCKS_ML_BUY_THRESHOLD:0.60}
stocks.ml.sell-threshold=${STOCKS_ML_SELL_THRESHOLD:0.60}
stocks.ml.round-trip-cost=${STOCKS_ML_ROUND_TRIP_COST:0.004}
stocks.recommendation.breakout-atr=${STOCKS_RECOMMENDATION_BREAKOUT_ATR:0.25}
stocks.recommendation.volume-multiple=${STOCKS_RECOMMENDATION_VOLUME_MULTIPLE:1.2}
stocks.recommendation.stop-atr=${STOCKS_RECOMMENDATION_STOP_ATR:1.5}
stocks.recommendation.target-atr=${STOCKS_RECOMMENDATION_TARGET_ATR:3.0}
stocks.recommendation.max-buy-rsi=${STOCKS_RECOMMENDATION_MAX_BUY_RSI:70}
# Bỏ qua xác thực checksum nghiêm ngặt khi các script migration lịch sử được tinh chỉnh
spring.flyway.validate-on-migrate=false

# Public Vietlott community feed; catch up at startup, then retry periodically.
lottery.sync.enabled=${LOTTERY_SYNC_ENABLED:true}
lottery.sync.interval-seconds=${LOTTERY_SYNC_INTERVAL_SECONDS:900}
lottery.sync.startup-delay-seconds=${LOTTERY_SYNC_STARTUP_DELAY_SECONDS:10}
lottery.sync.lookback-days=${LOTTERY_SYNC_LOOKBACK_DAYS:90}
lottery.sync.timeout-seconds=${LOTTERY_SYNC_TIMEOUT_SECONDS:20}
lottery.sync.mega-url=${LOTTERY_SYNC_MEGA_URL:https://raw.githubusercontent.com/vietvudanh/vietlott-data/main/data/power645.jsonl}
lottery.sync.power-url=${LOTTERY_SYNC_POWER_URL:https://raw.githubusercontent.com/vietvudanh/vietlott-data/main/data/power655.jsonl}
forecast.enabled=${FORECAST_ENABLED:true}
ai-lab.enabled=${AI_LAB_ENABLED:true}
ai-lab.feedback.learning-rate=${AI_LAB_FEEDBACK_LEARNING_RATE:0.05}
ai-lab.feedback.selected-extra-weight=${AI_LAB_FEEDBACK_SELECTED_EXTRA_WEIGHT:0.25}
ai-lab.feedback.maximum-draws=${AI_LAB_FEEDBACK_MAXIMUM_DRAWS:60}
mega-portfolio.enabled=${MEGA_PORTFOLIO_ENABLED:true}



# Capture new challenger batches independently; existing snapshots still reconcile.
ai-lab.challengers.enabled=${AI_LAB_CHALLENGERS_ENABLED:true}
