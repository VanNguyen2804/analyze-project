<header class="bg-white border-bottom shadow-sm">
  <div class="container py-3 d-flex justify-content-between align-items-center flex-wrap gap-2">
    <div class="d-flex align-items-center gap-2">
      <span class="fs-4">🎯</span>
      <div>
        <h1 class="h5 mb-0 fw-bold text-dark">Analyze Project</h1>
        <small class="text-muted">Quản lý bộ số H2 Database & Dự đoán mô hình XGBoost</small>
      </div>
    </div>
    <ul class="nav nav-pills">
      <li class="nav-item">
        <button
          class="nav-link fw-semibold"
          [class.active]="activeTab === 'manual'"
          (click)="setActiveTab('manual')"
        >
          📝 Tự nhập 6 số & Lưu DB H2
        </button>
      </li>
      <li class="nav-item">
        <button
          class="nav-link fw-semibold"
          [class.active]="activeTab === 'prediction'"
          (click)="setActiveTab('prediction')"
        >
          🤖 Dự đoán XGBoost AI
        </button>
      </li>
    </ul>
  </div>
</header>

<main class="main-content py-4 bg-light">
  <div *ngIf="activeTab === 'manual'">
    <app-manual-entry></app-manual-entry>
  </div>
  <div *ngIf="activeTab === 'prediction'">
    <app-prediction></app-prediction>
  </div>
</main>
