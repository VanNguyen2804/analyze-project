<div class="app-layout d-flex flex-column min-vh-100 bg-light">
  <!-- Zone 1: Header -->
  <app-header></app-header>

  <!-- Body layout: Left menu + Content -->
  <div class="d-flex flex-column flex-md-row flex-grow-1">
    <!-- Zone 2: Left Menu -->
    <app-left-menu
      [activeTab]="activeTab"
      (tabChange)="setActiveTab($event)"
    ></app-left-menu>

    <!-- Zone 3: Main Content Area -->
    <main class="flex-grow-1 p-3 p-md-4 overflow-auto">
      <div *ngIf="activeTab === 'manual'">
        <app-manual-entry></app-manual-entry>
      </div>
      <div *ngIf="activeTab === 'prediction'">
        <app-prediction></app-prediction>
      </div>
    </main>
  </div>
</div>
