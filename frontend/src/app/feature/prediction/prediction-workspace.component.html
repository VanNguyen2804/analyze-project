<section class="workspace">
  <header class="workspace-heading">
    <div>
      <span class="eyebrow">VIETLOTT / ANALYZE</span>
      <h1>Dự đoán & kết quả</h1>
    </div>
    <nav class="workspace-tabs" aria-label="Chức năng dự đoán">
      <a
        routerLink="/analyze"
        routerLinkActive="selected"
        [routerLinkActiveOptions]="{ exact: true }"
        ariaCurrentWhenActive="page"
        >✳ <strong>Tạo dự đoán</strong></a
      ><a routerLink="/analyze/history" routerLinkActive="selected" ariaCurrentWhenActive="page"
        >◷ <strong>Lịch sử & hiệu quả</strong></a
      ><a routerLink="/analyze/review" routerLinkActive="selected" ariaCurrentWhenActive="page"
        >◎ <strong>Phân tích kỳ quay</strong></a
      >
    </nav>
  </header>
  <router-outlet />
</section>
