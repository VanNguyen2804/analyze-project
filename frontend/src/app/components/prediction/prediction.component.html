<div class="container text-center my-5" style="max-width: 720px;">
  <h2 class="fw-bold mb-3 text-dark">Analyze Project - Dự đoán số liệu</h2>
  <p class="text-muted mb-4">Mô hình phân tích xác suất kết hợp thuật toán XGBoost và Logistic Scoring</p>

  <button
    id="btn-predict"
    class="btn btn-danger btn-lg px-4 py-2 shadow-sm"
    (click)="onPredict()"
    [disabled]="isSpinning"
  >
    <span *ngIf="isSpinning" class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
    {{ isSpinning ? 'Đang chạy mô hình XGBoost...' : 'Tiến hành phân tích' }}
  </button>

  <div *ngIf="errorMessage" class="alert alert-warning mt-4 text-start shadow-sm" role="alert">
    {{ errorMessage }}
  </div>

  <div
    *ngIf="predictedNumbers.length > 0"
    id="prediction-results"
    class="d-flex justify-content-center gap-3 mt-4 flex-wrap"
  >
    <div
      *ngFor="let num of predictedNumbers"
      class="ball"
      [id]="'ball-' + num"
    >
      {{ num < 10 ? '0' + num : num }}
    </div>
  </div>
</div>
