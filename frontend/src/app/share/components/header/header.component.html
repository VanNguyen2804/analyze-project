<header class="app-header">
  <button
    id="navigation-toggle"
    class="menu-toggle"
    type="button"
    (click)="navigation.toggle()"
    [attr.aria-expanded]="navigation.open()"
    aria-controls="primary-navigation"
    aria-label="Mở hoặc đóng menu"
  >
    ☰
  </button>
  <a class="brand" routerLink="/landing" aria-label="Trang chủ Analyze"
    ><span class="brand-mark" aria-hidden="true">✳</span
    ><span
      ><strong>{{ 'HEADER.TITLE' | translate }}</strong
      ><small>Phân tích dữ liệu · Theo dõi kết quả</small></span
    ></a
  >
  <div class="header-tools">
    <span class="workspace-label">Không gian phân tích</span
    ><label class="language-picker"
      ><span class="visually-hidden">Ngôn ngữ</span
      ><select [value]="currentLang()" (change)="languageChanged($event)">
        <option value="vi">Tiếng Việt</option>
        <option value="en">English</option>
        <option value="fr">Français</option>
      </select></label
    >
  </div>
</header>
