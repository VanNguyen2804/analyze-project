<header class="app-header d-flex align-items-center px-3 px-md-4 shadow-sm position-relative bg-white" style="height: 70px;">
  <div class="d-flex align-items-center justify-content-between w-100">
    
    <!-- Logo (Bên trái) -->
    <div class="d-flex align-items-center gap-2">
      <span class="fs-4">🎯</span>
      <div>
        <h1 class="h6 mb-0 fw-bold text-dark">Analyze Project</h1>
        <small class="text-muted d-none d-lg-inline">Spring Framework &bull; Angular &bull; XGBoost</small>
      </div>
    </div>

    <!-- Chọn danh mục xổ số (Căn giữa tuyệt đối) -->
    <div class="position-absolute top-50 start-50 translate-middle d-flex bg-light p-1 rounded-pill border shadow-sm" style="z-index: 10;">
      <button
        type="button"
        class="btn rounded-pill fw-semibold px-3 px-md-4 py-1 border-0 transition-all"
        [ngClass]="currentCategory === 'POWER' ? 'btn-primary shadow text-white' : 'btn-light text-muted'"
        (click)="selectCategory('POWER')"
      >
        🔵 Power 6/55
      </button>
      <button
        type="button"
        class="btn rounded-pill fw-semibold px-3 px-md-4 py-1 border-0 transition-all"
        [ngClass]="currentCategory === 'MEGA' ? 'btn-danger shadow text-white' : 'btn-light text-muted'"
        (click)="selectCategory('MEGA')"
      >
        🔴 Mega 6/45
      </button>
    </div>

    <!-- Menu Điều hướng Navigation (Bên phải) -->
    <div class="d-none d-lg-flex align-items-center gap-4">
      <!-- Thêm menu Học Tiếng Pháp -->
      <a 
        routerLink="/french" 
        routerLinkActive="text-primary fw-bold border-bottom border-2 border-primary pb-1" 
        class="text-decoration-none text-secondary transition-hover" 
        style="font-size: 0.95rem;"
      >
        🇫🇷 Học Tiếng Pháp
      </a>
      <a 
        routerLink="/analyze" 
        routerLinkActive="text-primary fw-bold border-bottom border-2 border-primary pb-1" 
        class="text-decoration-none text-secondary transition-hover" 
        style="font-size: 0.95rem;"
      >
        ⚡ Phân Tích AI
      </a>
      <a 
        routerLink="/entry" 
        routerLinkActive="text-primary fw-bold border-bottom border-2 border-primary pb-1" 
        class="text-decoration-none text-secondary transition-hover" 
        style="font-size: 0.95rem;"
      >
        📝 Nhập & Dò Vé
      </a>
    </div>

  </div>
</header>
